<div class="login-page" style="position: relative">
  <app-glow-horizon variant="top"></app-glow-horizon>

  <div class="login-content">
    <div class="login-card">
      <div class="login-card__header">
        <div class="login-card__title-wrap">
          <span class="login-card__logo">💰</span>
          <h1 class="login-card__title">Control de Gastos</h1>
        </div>
        <p class="login-card__subtitle">Inicia sesión para ingresar</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" class="login-form">
        <div class="form-group">
          <label class="form-label" for="username">User</label>
          <input
            id="username"
            name="username"
            type="text"
            class="form-input"
            [(ngModel)]="username"
            placeholder="admin o user"
            required>
          <small *ngIf="loginForm.controls['username']?.invalid && loginForm.controls['username']?.touched" class="form-error">
            El usuario es obligatorio
          </small>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            [(ngModel)]="password"
            placeholder="••••••••"
            required>
          <small *ngIf="loginForm.controls['password']?.invalid && loginForm.controls['password']?.touched" class="form-error">
            La contraseña es obligatoria
          </small>
        </div>

        <div *ngIf="errorMessage" class="alert alert--error">
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="loading">
          <span *ngIf="loading" class="spinner"></span>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>
    </div>
  </div>
</div>
